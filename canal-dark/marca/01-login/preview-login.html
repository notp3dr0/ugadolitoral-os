<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia Ludique &amp; Sunika | Prévia da entrada</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#102346;background:#f9f5e6;font:16px system-ui,sans-serif}
main{min-height:100svh;display:grid;grid-template-columns:minmax(0,2fr) minmax(310px,1fr)}
.scene{position:relative;min-height:100%;background:#254766 url('fundo-estatico.jpg') 65% center/cover}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:65% center}
.control{position:absolute;bottom:20px;left:20px;color:white;background:#102346;border:1px solid #fff8;border-radius:5px;padding:10px 14px;cursor:pointer}
section{align-self:center;margin:auto;width:min(100%,460px);padding:44px 42px}
.brand{font-family:Georgia,serif;font-size:clamp(21px,2vw,31px);font-weight:bold;line-height:1.04}
.brand::after{content:"";display:block;width:48px;height:3px;margin-top:20px;background:#ffc900}
h1{font:500 clamp(40px,5vw,67px)/1 Georgia,serif;margin:40px 0 27px}
label{display:block;margin:16px 0 6px;font-weight:600}
input{height:46px;width:100%;border:1px solid #263752;border-radius:4px;background:#fffaf2;padding:0 12px;font:inherit}
.primary{height:48px;width:100%;border:0;border-radius:4px;background:#063fa4;color:white;margin-top:24px;font:600 16px system-ui}
input:focus-visible,button:focus-visible{outline:3px solid #edab00;outline-offset:3px}
.note{font-size:14px;color:#485364;line-height:1.45}
.recovery{font-size:14px;text-decoration:underline;text-underline-offset:3px}
@media(max-width:680px){main{display:block}.scene{min-height:0;height:33svh}.control{bottom:8px;left:8px;font-size:12px;padding:7px 9px}section{padding:26px 24px 40px}h1{margin:26px 0 20px}}
@media(prefers-reduced-motion:reduce){video,.control{display:none}}
</style></head><body>
<main><div class="scene">
<video id="scene" muted loop playsinline aria-hidden="true"></video>
<button class="control" type="button" hidden>Pausar fundo</button></div>
<section aria-label="Prévia visual do login">
<div class="brand">Academia<br>Ludique &amp; Sunika</div><h1>Entrar</h1>
<label for="email">E-mail</label><input id="email" type="email" autocomplete="off">
<label for="senha">Senha</label><input id="senha" type="password" autocomplete="off">
<button class="primary" type="button" aria-disabled="true">Entrar na Academia</button>
<p class="recovery">Esqueci minha senha</p>
<p class="note">Acesso por convite<br>Prévia visual</p>
</section></main>
<script>
const video = document.querySelector('#scene');
const control = document.querySelector('.control');
const preference = matchMedia('(prefers-reduced-motion: reduce)');
function sync() {
  if (preference.matches) {
    video.pause();
    control.hidden = true;
    return;
  }
  if (!video.getAttribute('src')) video.src = 'fundo-login.mp4';
  control.hidden = false;
  video.play().catch(() => { control.textContent = 'Reproduzir fundo'; });
}
control.addEventListener('click', () => {
  if (video.paused) video.play().catch(() => {});
  else video.pause();
});
video.addEventListener('play', () => { control.textContent = 'Pausar fundo'; });
video.addEventListener('pause', () => { control.textContent = 'Reproduzir fundo'; });
preference.addEventListener('change', sync);
sync();
</script></body></html>
