<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: P; src: url(assets/fonts/Poppins-Regular.ttf); font-weight: 400; }
  @font-face { font-family: P; src: url(assets/fonts/Poppins-SemiBold.ttf); font-weight: 600; }
  html, body { margin: 0; background: #f1e9da; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { PAL } from './js/engine.js';
import { pessoa, mao, frasco, ST } from './js/personagens.js';
const q = new URLSearchParams(location.search), who = q.get('p') || 'pesquisadora';
const ctx = document.getElementById('c').getContext('2d');
const papel = new Image(); papel.src = 'assets/marca/papel.png'; await papel.decode();
await document.fonts.load('600 30px P'); await document.fonts.load('400 22px P');
window.seek = (v) => {
  ST.v = v | 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = PAL.cream; ctx.fillRect(0, 0, 1920, 1080);
  const nome = { pesquisadora: 'Pesquisadora, ex-bolsista', advogado: 'Advogado, ex-bolsista', bolsista: 'Bolsista, transporte' }[who];
  ctx.fillStyle = PAL.ink; ctx.font = '600 34px P'; ctx.fillText(nome, 70, 80);
  ctx.font = '400 20px P'; ctx.fillStyle = '#7a6a58';
  const rot = (s, x) => ctx.fillText(s, x, 1030);
  pessoa(ctx, who, { tr: 0, sorri: 0.1 }, { x: 260, y: 470, s: 1.05 }); rot('frente · neutra', 170);
  pessoa(ctx, who, { tr: 0.5, sorri: 0.1, gx: 0.6 }, { x: 740, y: 470, s: 1.05 }); rot('três quartos · neutra', 640);
  pessoa(ctx, who, { tr: 0.5, sorri: 1, aberto: who === 'bolsista' ? 0.7 : 0, gx: 0.6, sobr: 0.6 }, { x: 1220, y: 470, s: 1.05 }); rot(who === 'bolsista' ? 'três quartos · sorriso aberto' : 'três quartos · sorriso discreto', 1100);
  // estudo das mãos com o objeto
  const pele = { pesquisadora: '#7a4a2c', advogado: '#c48c62', bolsista: '#6b3f26' }[who];
  if (who === 'pesquisadora') {
    frasco(ctx, { x: 1680, y: 760, s: 1.0 });
    mao(ctx, pele, 'segura', { x: 1600, y: 650, s: 1.0 }, { a: 0 });
    mao(ctx, pele, 'segura', { x: 1560, y: 900, s: 1.0, r: 0 }, { a: 1, id: 950 });
  } else if (who === 'advogado') {
    ctx.save(); ctx.translate(1700, 700); ctx.rotate(-0.12); ctx.fillStyle = PAL.hi; ctx.fillRect(-150, -200, 300, 400); ctx.restore();
    mao(ctx, pele, 'aponta', { x: 1520, y: 640, s: 1.3, r: 0.2 });
    mao(ctx, pele, 'pinca', { x: 1560, y: 900, s: 1.1, r: -0.1 }, { id: 950 });
  } else {
    mao(ctx, pele, 'aponta', { x: 1520, y: 640, s: 1.3, r: 0.35 });
    mao(ctx, pele, 'apoia', { x: 1540, y: 880, s: 1.1, r: 0 }, { id: 950 });
  }
  rot('mãos + objeto', 1600);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.5; ctx.drawImage(papel, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
};
window.pronto = true; window.seek(0);
</script></body></html>
