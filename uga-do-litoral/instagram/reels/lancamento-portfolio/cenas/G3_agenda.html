<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>G3_agenda</title>
<style>
  html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; }
  /* o fundo do site: preto com o calor vermelho embaixo à esquerda (style.css, .liquid-background) */
  body { background: radial-gradient(ellipse at 20% 70%, #270000 0, transparent 65%), #000; }
  canvas { position: absolute; inset: 0; width: 540px; height: 960px; display: block; }
</style></head>
<body>
<canvas id="fluido" width="1080" height="1920"></canvas>
<canvas id="tipo" width="1080" height="1920"></canvas>
<script type="module">
// v3: só AGENDA ABERTA (o Pedro tirou o site, o @, o UGA DO LITORAL e o risco de lápis, 2026-11-16).
// As batidas 65, 66 e 67, que traziam o texto, viram três respiros de luz vermelha atrás do título.
import { FMT, W, H, carregarTempo, carregarFontes, prog, inOutSine } from './comum.js';
import { criarFluido } from './fluido.js';

const tempo = await carregarTempo();
await carregarFontes();
const F0 = tempo.batidas.find(b => b.b === 64).f;
const L = b => tempo.batidas.find(x => x.b === b).f - F0;
const B65 = L(65), B66 = L(66), B67 = L(67), CORTE = tempo.corte_musica_f - F0;
const AQUECE = 150;

for (const id of ['fluido', 'tipo']) { const el = document.getElementById(id); el.width = W; el.height = H; }
const fluido = criarFluido(document.getElementById('fluido'), { intensity: .62, autoSpeed: .34, ganho: .78, fase: 11.0, cssW: W / 2, cssH: H / 2 });
const cv = document.getElementById('tipo'), c = cv.getContext('2d');

// composição: AGENDA ABERTA pequeno (pouco maior que uma legenda), numa linha, no centro (pedido do Pedro, 2026-11-16)
const V = FMT === 'v';
const CORPO = V ? 66 : 58, ESPACO = .14;   // Arimo 700, aberto
const CY = H / 2;
const TEXTO = 'AGENDA ABERTA';
// o embaralhado do site (site-lab/js/embaralha.js): símbolos que se resolvem da esquerda pra direita
const SIMBOLOS = '%#&+/*=';
function letras(n) {
  // entrada: resolve em 16 quadros; nas batidas 65, 66 e 67 a metade final volta a embaralhar por 5 quadros
  const fases = [[0, 16, 0], [B65, 5, .55], [B66, 5, .45], [B67, 6, .3]];
  let r = 1;
  for (const [f, d, desde] of fases) if (n >= f && n < f + d) r = desde + (1 - desde) * (n - f) / d;
  const passo = Math.round(r * 42), resolvidas = Math.floor(r * TEXTO.length);
  return [...TEXTO].map((l, i) => (i < resolvidas || l === ' ' || r >= 1) ? l : SIMBOLOS[(i * 3 + passo) % SIMBOLOS.length]);
}
c.font = `700 ${CORPO}px 'Arimo', Arial, sans-serif`;
const larg = [...TEXTO].map(l => c.measureText(l).width + ESPACO * CORPO);
const TOTAL = larg.reduce((x, y) => x + y, 0) - ESPACO * CORPO;
const X = []; { let x = W / 2 - TOTAL / 2; larg.forEach(w => { X.push(x + (w - ESPACO * CORPO) / 2); x += w; }); }

// respiro: a luz sobe na batida e cai em ~9 quadros; cada um um pouco maior
function respiro(n) {
  let a = 0;
  [[B65, .26], [B66, .32], [B67, .40]].forEach(([b, pico]) => {
    if (n < b) return;
    a = Math.max(a, pico * Math.exp(-2.4 * (n - b) / 9) * (1 - Math.exp(-14 * (n - b + .35))));
  });
  if (n >= CORTE) a = Math.max(a, .08 * Math.exp(-(n - CORTE) / 30));
  return a;
}

window.desenhar = n => {
  fluido.irPara(AQUECE + n);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  const a = respiro(n);
  if (a > .002) {
    const r = Math.max(W, H) * .5;
    const g = c.createRadialGradient(W / 2, CY, 0, W / 2, CY, r);
    g.addColorStop(0, `rgba(205,8,4,${a})`); g.addColorStop(.45, `rgba(150,0,0,${a * .45})`); g.addColorStop(1, 'rgba(90,0,0,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
  // a câmera entra devagar até o fim
  const k = 1 + .05 * inOutSine(prog(n, 0, 97));
  c.translate(W / 2, CY); c.scale(k, k); c.translate(-W / 2, -CY);
  c.font = `700 ${CORPO}px 'Arimo', Arial, sans-serif`;
  c.fillStyle = '#f2f0eb'; c.textAlign = 'center'; c.textBaseline = 'middle';
  letras(n).forEach((l, i) => c.fillText(l, X[i], CY));
};
window.CENA = { id: 'G3_agenda', quadros: 98, formato: 'jpg', marcos: { B65, B66, B67, CORTE }, obs: 'v3: só AGENDA ABERTA, pequeno e embaralhando como no site; respiros de luz vermelha nas batidas 65 a 67' };
window.pronto = true;
</script>
</body></html>
