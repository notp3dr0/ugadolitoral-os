  <script>
    // Q08 · O movimento volta · f960-1109 (32,00-37,00 s)
    // As miniaturas da Q07 abrem em TV, player e painel digital. A roda segue congelada
    // na pose do f042 até o f1020 (2,0 s locais), retoma dali e toca o chão no f1026
    // (2,2 s) nas três telas ao mesmo tempo: pneu achatado 5% por 3 f, respingo em leque.
    const tl = gsap.timeline({ paused: true });
    const c = "#q08-cena ";
    const encaixa = (sel, w, h) => {
      const s = h / 1080;
      const x = 1920 * s <= w + 0.5 ? 0 : w / 2 - 1192 * s;
      gsap.set(sel + " .peca", { scale: s, x: x, y: 0 });
    };
    encaixa("#q08-tv", 620, 348.75);
    encaixa("#q08-st", 520, 292.5);
    encaixa("#q08-pn", 230, 409);

    const RETOMA = 2.0;   // f1020
    const CONTATO = 2.2;  // f1026
    const FIM = 5.0;
    const agua = c + ".a-poca, " + c + ".a-leque, " + c + ".a-gota";

    tl.fromTo("#q08-sai", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, 0);
    tl.fromTo("#q08-chao", { backgroundColor: "#f3f2eb" }, { backgroundColor: "#d5ebf7", duration: 0.4, ease: "power2.inOut" }, 0.1);
    // as molduras abrem a partir das miniaturas da Q07 (4 f de intervalo, como o disparo)
    tl.fromTo("#q08-tv", { x: 875, y: -34.25, scale: 224 / 620 }, { x: 0, y: 0, scale: 1, duration: 0.75, ease: "power3.inOut" }, 0.1);
    tl.fromTo("#q08-st", { x: 195, y: 90.5, scale: 224 / 520 }, { x: 0, y: 0, scale: 1, duration: 0.75, ease: "power3.inOut" }, 0.1 + 4 / 30);
    tl.fromTo("#q08-pn", { x: -233, y: 405, scale: 72 / 230 }, { x: 0, y: 0, scale: 1, duration: 0.75, ease: "power3.inOut" }, 0.1 + 8 / 30);
    tl.fromTo(["#q08-pn .poste", "#q08-pn .base"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.45);
    tl.fromTo(".q08-nome", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.067, ease: "power2.out" }, 0.95);
    gsap.set(agua, { opacity: 0 });
    gsap.set(".q08-risco", { opacity: 0, rotation: -16, x: 160 });
    gsap.set("#q08-st .barra i", { scaleX: 0.02 });

    // f1020: a roda retoma da pose congelada a 360°/s e desce os 16 px restantes em 6 f
    tl.to(c + ".p-roda", { rotation: 360 * (FIM - RETOMA), duration: FIM - RETOMA, ease: "none" }, RETOMA);
    tl.to(c + ".p-grupo", { y: 16, duration: CONTATO - RETOMA, ease: "power2.in" }, RETOMA);
    // f1026: contato. Pneu achatado 5% por 3 f, corte seco nos dois lados.
    tl.set(c + ".p-squash", { scaleY: 0.95, scaleX: 1.025 }, CONTATO);
    tl.set(c + ".p-squash", { scaleY: 1, scaleX: 1 }, CONTATO + 3 / 30);
    tl.set("#q08-palco", { scale: 1.02 }, CONTATO);
    tl.to("#q08-palco", { scale: 1, duration: 0.35, ease: "expo.out" }, CONTATO);
    // o mundo volta a correr na velocidade do pneu
    tl.to(c + ".p-faixas", { x: -2488 * (FIM - CONTATO), duration: FIM - CONTATO, ease: "none" }, CONTATO);
    tl.set(c + ".p-riscos", { x: 220 }, CONTATO);
    tl.to(c + ".p-riscos", { x: -140, duration: 0.35, ease: "none", repeat: 7 }, CONTATO);
    tl.to("#q08-st .barra i", { scaleX: 1, duration: FIM - CONTATO, ease: "none" }, CONTATO);
    tl.set(".q08-risco", { opacity: 1 }, CONTATO);
    tl.to(".q08-risco", { x: -60, duration: FIM - CONTATO, ease: "none" }, CONTATO);

    // respingo em leque, o mesmo nas três telas
    tl.set(agua, { opacity: 1 }, CONTATO);
    tl.set(c + ".a-poca", { scaleX: 0.3, svgOrigin: "1192 868" }, CONTATO);
    tl.to(c + ".a-poca", { scaleX: 1, duration: 0.5, ease: "expo.out" }, CONTATO);
    tl.to(c + ".a-poca", { opacity: 0, duration: 0.6, ease: "power2.in" }, CONTATO + 1.0);
    tl.set(c + ".a-leque-e, " + c + ".a-leque-e2", { scale: 0, svgOrigin: "1180 866" }, CONTATO);
    tl.set(c + ".a-leque-d, " + c + ".a-leque-d2", { scale: 0, svgOrigin: "1204 866" }, CONTATO);
    tl.to(c + ".a-leque", { scale: 1, duration: 0.28, ease: "expo.out" }, CONTATO);
    tl.to(c + ".a-leque", { scaleY: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, CONTATO + 0.3);
    const gotas = [[-1, 150, 170], [-1, 250, 250], [-1, 340, 200], [-1, 430, 130], [-1, 520, 90], [-1, 210, 320],
                   [1, 160, 180], [1, 260, 260], [1, 350, 210], [1, 440, 140], [1, 530, 95], [1, 220, 330]];
    gotas.forEach(([s, dx, h], i) => {
      const g = c + ".a-g" + i, voo = 0.55 + (i % 4) * 0.06;
      tl.to(g, { x: s * dx, duration: voo, ease: "power1.out" }, CONTATO);
      tl.to(g, { y: -h, duration: voo * 0.45, ease: "power2.out" }, CONTATO);
      tl.to(g, { y: 30, duration: voo * 0.55, ease: "power2.in" }, CONTATO + voo * 0.45);
      tl.to(g, { scale: 0.2, opacity: 0, transformOrigin: "50% 50%", duration: 0.15, ease: "power2.in" }, CONTATO + voo - 0.1);
    });

    // saída: o palco desce e some; a Q09 abre no azul-claro limpo
    tl.to("#q08-palco", { y: 40, opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in" }, 4.75);
    window.__timelines["q08"] = tl;
